<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}SystShop{% endblock %}</title>
  {% load static %}
  <!-- ... styles ... -->
</head>
<body>

{% if user.is_authenticated %}
<nav>
  <a href="{% url 'dashboard' %}" class="nav-brand">sys_shop /</a>
  <div class="nav-links">
    <a href="{% url 'dashboard' %}">Dashboard</a>
    <a href="{% url 'product_list' %}">Products</a>
    <a href="{% url 'record_sale' %}">Record Sale</a>
    <a href="{% url 'stock_in' %}">Stock In</a>
    <a href="{% url 'sales_history' %}">History</a>
  </div>
  <div class="nav-right">
    <span>{{ user.username }}</span>
    <form method="post" action="{% url 'logout' %}" style="display:inline;">
      {% csrf_token %}
      <button type="submit" style="background:none; border:none; color:inherit; cursor:pointer;">Logout</button>
    </form>
  </div>
</nav>
{% endif %}

<main>
  {% if messages %}
  <div class="messages">
    {% for message in messages %}
    <div class="msg msg-{{ message.tags }}">{{ message }}</div>
    {% endfor %}
  </div>
  {% endif %}
  {% block content %}{% endblock %}
</main>

</body>
</html>
