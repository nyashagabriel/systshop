<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Record Sale — Tuckshop Manager</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --border: #2a2a2a;
      --accent: #f0c93a;
      --text: #e8e8e8;
      --text2: #999;
      --danger: #f87171;
    }
    
    body {
      background: var(--bg);
      color: var(--text);
      font-family: sans-serif;
      margin: 0;
      padding: 3rem 2rem;
      line-height: 1.6;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 2rem;
      border-radius: 6px;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
      color: var(--text);
    }

    .subtitle {
      color: var(--text2);
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 0.4rem;
      color: var(--text2);
    }

    select, input {
      width: 100%;
      padding: 0.75rem;
      background: #151515;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: 0.9rem;
      box-sizing: border-box;
    }

    button {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin-top: 1rem;
    }
    
    button:hover {
      opacity: 0.9;
    }

    .messages {
      margin-bottom: 1.25rem;
    }

    .alert {
      padding: 0.75rem;
      border-radius: 4px;
      font-size: 0.85rem;
      background: #f871710a;
      border: 1px solid rgba(248, 113, 113, 0.25);
      color: var(--danger);
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Record a Sale</h1>
  <div class="subtitle">Enter sale details for the tuckshop</div>

  {% if messages %}
    <div class="messages">
      {% for message in messages %}
        <div class="alert">{{ message }}</div>
      {% endfor %}
    </div>
  {% endif %}

  <form method="POST">
    {% csrf_token %}
    
    {% for field in form %}
      <div class="form-group">
        <label>{{ field.label }}</label>
        {{ field }}
      </div>
    {% endfor %}
    
    <button type="submit">Complete Sale</button>
  </form>
</div>

</body>
</html>
