{% extends 'inventory/base.html' %}
{% block title %}Stock In — SystShop{% endblock %}
{% block content %}

<div class="page-header">
  <h1 class="page-title">Stock <span>In</span></h1>
  <a href="{% url 'product_list' %}" class="btn btn-secondary">← Products</a>
</div>

<div class="card" style="max-width:480px">
  <p style="color:var(--text2);font-size:.88rem;margin-bottom:1.25rem">
    Select a product and enter the quantity received. Stock updates immediately.
  </p>
  <form method="post">
    {% csrf_token %}
    <div class="form-group">
      <label>Product</label>
      {{ form.product }}
    </div>
    <div class="form-group">
      <label>Quantity Received</label>
      {{ form.quantity_added }}
    </div>
    <div style="margin-top:1.5rem;display:flex;gap:.75rem">
      <button type="submit" class="btn btn-green">+ Confirm Stock In</button>
      <a href="{% url 'product_list' %}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>

{% endblock %}
