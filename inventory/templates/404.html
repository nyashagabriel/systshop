<!DOCTYPE html>
<html lang="en" style="color-scheme:dark;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 – Page Not Found | SystShop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#081120;--bg-elevated:#0f1b31;
      --text:#fff;--text-muted:#cbd5e1;--border:rgba(165,183,209,.18);
      --accent:#5ca7ff;--accent-strong:#2f7de1;
      --radius:18px;--radius-sm:12px;
    }
    body{
      min-height:100vh;color:var(--text);
      font-family:Inter,ui-sans-serif,system-ui,sans-serif;
      background:
        radial-gradient(circle at 20% 20%,rgba(92,167,255,.16),transparent 35%),
        radial-gradient(circle at 80% 80%,rgba(47,125,225,.12),transparent 35%),
        var(--bg);
      display:grid;place-items:center;padding:2rem;
    }
    .card{
      background:rgba(15,27,49,.7);border:1px solid var(--border);
      border-radius:var(--radius);padding:3.5rem 2.5rem 3rem;max-width:580px;width:100%;
      backdrop-filter:blur(20px);box-shadow:0 28px 60px rgba(5,11,24,.45);
      text-align:center;
    }
    .orbit{position:relative;width:120px;height:120px;margin:0 auto 2rem;animation:spin 18s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg)}}
    .orbit-dot{
      position:absolute;width:10px;height:10px;border-radius:50%;
      background:var(--accent);top:0;left:50%;transform:translateX(-50%);
      box-shadow:0 0 12px var(--accent);
    }
    .orbit-ring{
      width:100%;height:100%;border-radius:50%;
      border:1px solid rgba(92,167,255,.25);
    }
    .orbit-center{
      position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
      font-size:2.5rem;line-height:1;animation:spin 18s linear infinite reverse;
    }
    .code{
      font-size:clamp(4rem,14vw,7rem);font-weight:700;line-height:1;
      background:linear-gradient(135deg,var(--accent),#a0c9ff);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
      background-clip:text;letter-spacing:-3px;
    }
    .eyebrow{font-size:.75rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);opacity:.8;margin-top:.5rem;display:block;}
    h1{font-size:1.6rem;font-weight:700;margin:.75rem 0 .5rem;}
    p{color:var(--text-muted);font-size:.95rem;line-height:1.7;margin-bottom:2rem;}
    .btn-group{display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap;}
    .btn{
      display:inline-flex;align-items:center;padding:.75rem 1.75rem;
      background:linear-gradient(135deg,var(--accent-strong),var(--accent));
      color:#fff;border:none;border-radius:var(--radius-sm);font-size:.9rem;
      font-weight:600;text-decoration:none;cursor:pointer;transition:opacity .2s;
    }
    .btn:hover{opacity:.88;}
    .btn-ghost{
      background:transparent;border:1px solid var(--border);color:var(--text-muted);
      display:inline-flex;align-items:center;padding:.75rem 1.75rem;
      border-radius:var(--radius-sm);font-size:.9rem;font-weight:600;text-decoration:none;
      transition:border-color .2s,color .2s;
    }
    .btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
    .logo{font-weight:700;font-size:1.1rem;letter-spacing:-.02em;color:var(--accent);margin-bottom:2rem;display:block;}
    .meta{margin-top:2rem;font-size:.8rem;color:rgba(203,213,225,.4);}
  </style>
</head>
<body>
  <div class="card">
    <span class="logo">⬡ SystShop</span>
    <div class="orbit">
      <div class="orbit-ring"></div>
      <div class="orbit-dot"></div>
      <div class="orbit-center">🔍</div>
    </div>
    <div class="code">404</div>
    <span class="eyebrow">Page Not Found</span>
    <h1>We lost this page in the inventory.</h1>
    <p>The page you're looking for doesn't exist, has been moved, or the link may be broken. Head back to your dashboard to get back on track.</p>
    <div class="btn-group">
      <a href="/" class="btn">↩ Back to Login</a>
      <a href="javascript:history.back()" class="btn-ghost">Go Back</a>
    </div>
    <p class="meta">Error 404 · SystShop Platform</p>
  </div>
</body>
</html>
