<!DOCTYPE html>
<html lang="en" style="color-scheme:dark;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>403 – Access Denied | SystShop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#081120;--bg-elevated:#0f1b31;--bg-panel:#12213c;
      --text:#fff;--text-muted:#cbd5e1;--border:rgba(165,183,209,.18);
      --accent:#5ca7ff;--accent-strong:#2f7de1;--danger:#ff6f61;
      --radius:18px;--radius-sm:12px;
    }
    body{
      min-height:100vh;color:var(--text);
      font-family:Inter,ui-sans-serif,system-ui,sans-serif;
      background:
        radial-gradient(circle at top left,rgba(255,111,97,.12),transparent 26%),
        radial-gradient(circle at bottom right,rgba(47,125,225,.12),transparent 30%),
        var(--bg);
      display:grid;place-items:center;padding:2rem;
    }
    .card{
      background:rgba(15,27,49,.7);border:1px solid var(--border);
      border-radius:var(--radius);padding:3rem 2.5rem;max-width:560px;width:100%;
      backdrop-filter:blur(20px);box-shadow:0 28px 60px rgba(5,11,24,.45);
      text-align:center;
    }
    .icon{font-size:3.5rem;line-height:1;margin-bottom:.5rem;}
    .code{
      font-size:clamp(4rem,14vw,7rem);font-weight:700;line-height:1;
      background:linear-gradient(135deg,var(--danger),#ff9f43);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
      background-clip:text;letter-spacing:-3px;
    }
    .eyebrow{font-size:.75rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--danger);opacity:.85;margin-top:.5rem;display:block;}
    h1{font-size:1.6rem;font-weight:700;margin:.75rem 0 .5rem;}
    p{color:var(--text-muted);font-size:.95rem;line-height:1.7;margin-bottom:2rem;}
    .btn-group{display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap;}
    .btn{
      display:inline-flex;align-items:center;padding:.75rem 1.75rem;
      background:linear-gradient(135deg,var(--accent-strong),var(--accent));
      color:#fff;border:none;border-radius:var(--radius-sm);font-size:.9rem;
      font-weight:600;text-decoration:none;cursor:pointer;transition:opacity .2s;
    }
    .btn:hover{opacity:.88;}
    .btn-ghost{
      background:transparent;border:1px solid var(--border);color:var(--text-muted);
      display:inline-flex;align-items:center;padding:.75rem 1.75rem;
      border-radius:var(--radius-sm);font-size:.9rem;font-weight:600;text-decoration:none;
      transition:border-color .2s,color .2s;
    }
    .btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
    .logo{font-weight:700;font-size:1.1rem;letter-spacing:-.02em;color:var(--accent);margin-bottom:2.5rem;display:block;}
    .meta{margin-top:2rem;font-size:.8rem;color:rgba(203,213,225,.4);}
    .shield{
      width:56px;height:56px;margin:0 auto 1rem;
      background:rgba(255,111,97,.1);border:1px solid rgba(255,111,97,.25);
      border-radius:50%;display:grid;place-items:center;font-size:1.6rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="logo">⬡ SystShop</span>
    <div class="shield">🔒</div>
    <div class="code">403</div>
    <span class="eyebrow">Access Denied</span>
    <h1>You're not authorized to view this.</h1>
    <p>Your account doesn't have the permissions needed to access this resource. If you believe this is a mistake, please contact your Company Administrator.</p>
    <div class="btn-group">
      <a href="/" class="btn">↩ Back to Login</a>
      <a href="javascript:history.back()" class="btn-ghost">Go Back</a>
    </div>
    <p class="meta">Error 403 · SystShop Platform</p>
  </div>
</body>
</html>
